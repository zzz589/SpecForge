# Qwen3-VL-4B + DFlash2, using the PR785 multimodal capture path.
#
# This is deliberately based on two already exercised paths rather than a new
# training stack:
#   * the Qwen3-VL-4B PR785 DSpark run supplies the target, corpus, two-rank
#     topology, SDPA backend and producer_lease=1 compatibility setting;
#   * the upstream Qwen3.8 DFlash2 recipe supplies the DFlash2 objective and
#     selector settings.
#
# The draft starts from DFlash2's stable identity/no-op initialization.  Do not
# point draft_checkpoint_path at a DFlash1 checkpoint: strict warm-start
# validation correctly rejects the missing convolution and selector weights.
model:
  target_model_path: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/models/Qwen3-VL-4B-Instruct
  draft_model_config: configs/qwen3-vl-4b-dflash2-b16.json
  target_backend: sglang
  input_modality: multimodal
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  torch_dtype: bfloat16
  mask_token_id: 151669
  sglang_context_length: 4111

data:
  train_data_path: /XYAIFS00/HDD_POOL/nsccgz_zgchen/nsccgz_zgchen_8/xj/data/mixed_llava_power/mixed_llava34000_power7561_seed20261014_pr785_dspark.jsonl
  max_length: 4096
  chat_template: qwen
  cache_dir: /XYAIFS00/HDD_POOL/nsccgz_zgchen/nsccgz_zgchen_8/xj/experiments/qwen3-vl-4b-dflash2-b16-pr785/cache
  build_dataset_num_proc: 32
  dataloader_num_workers: 8

training:
  # DFlash2 is selected by the draft JSON architecture and shares DFlash's
  # capture and optimization strategy.
  strategy: dflash
  num_epochs: 3
  batch_size: 1
  accumulation_steps: 2
  learning_rate: 0.0005
  lr_scheduler: constant
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  attention_backend: sdpa
  num_anchors: 32
  loss_decay_gamma: 7.0
  objective_chunk_blocks: 128
  loss_type: dflash
  dflash_teacher_metrics: false
  dflash2_selector_loss_alpha: 1.0
  dflash2_selector_stop_gradient: false
  save_interval: 2000
  log_interval: 10
  dist_timeout: 30
  seed: 20261014
  prompt_seed: 20261014

tracking:
  report_to: none

runtime:
  # Required by the already validated Qwen3-VL + SGLang 0.5.18 capture path:
  # one logical VLM task per /generate request avoids its batched RID issue.
  producer_lease: 1
  producer_concurrency: 1

run_id: qwen3-vl-4b-dflash2-b16-pr785
output_dir: /XYAIFS00/HDD_POOL/nsccgz_zgchen/nsccgz_zgchen_8/xj/experiments/qwen3-vl-4b-dflash2-b16-pr785/output

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 2
  disaggregated:
    control_dir: /XYAIFS00/HDD_POOL/nsccgz_zgchen/nsccgz_zgchen_8/xj/experiments/qwen3-vl-4b-dflash2-b16-pr785/control
    consumer_state_dir: /XYAIFS00/HDD_POOL/nsccgz_zgchen/nsccgz_zgchen_8/xj/experiments/qwen3-vl-4b-dflash2-b16-pr785/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
