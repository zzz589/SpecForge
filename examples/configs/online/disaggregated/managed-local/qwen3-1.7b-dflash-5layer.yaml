model:
  target_model_path: "models/Qwen3-1.7B"
  draft_model_config: "configs/qwen3-1.7b-dflash-5layer.json"
  target_backend: "sglang"
  trust_remote_code: true
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
  mask_token_id: 151669

data:
  train_data_path: "data/train_text_regen.jsonl"
  max_length: 3072
  chat_template: "qwen"
  train_only_last_turn: false
  build_dataset_num_proc: 16
  dataloader_num_workers: 4
  cache_dir: "outputs/qwen3-1.7b-dflash-5layer/cache"

training:
  strategy: "dflash"
  num_epochs: 10
  max_steps: 80000
  batch_size: 2
  learning_rate: 0.0001
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: "flex_attention"
  num_anchors: 512
  loss_decay_gamma: 7
  save_interval: 500
  max_checkpoints: 3
  log_interval: 10
  dist_timeout: 30
  seed: 42

tracking:
  report_to: "none"

run_id: "qwen3-1.7b-dflash-5layer"
output_dir: "outputs/qwen3-1.7b-dflash-5layer"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: "outputs/qwen3-1.7b-dflash-5layer/control"
    consumer_state_dir: "outputs/qwen3-1.7b-dflash-5layer/consumer-state"
    backend: mooncake
    managed_local:
      trainer_cuda_visible_devices: ["7"]
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 34359738368
        local_buffer_size_bytes: 1073741824
      capture_servers:
        - port: 30017
          cuda_visible_devices: ["0"]
          tp_size: 1
          mem_fraction_static: 0.5
