# Qwen3-VL-4B + DFlash2 managed-local smoke recipe for the PR785 VLM path.
# The supervisor owns Mooncake, one capture server, one trainer, and cleanup.
model:
  target_model_path: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/models/Qwen3-VL-4B-Instruct
  draft_model_config: configs/qwen3-vl-4b-dflash2-b16.json
  target_backend: sglang
  input_modality: multimodal
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  torch_dtype: bfloat16
  mask_token_id: 151669
  sglang_attention_backend: triton
  sglang_disable_radix_cache: true
  sglang_disable_cuda_graph: true
  sglang_context_length: 4111

data:
  train_data_path: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/data/regen_textqva-100-flow-test.jsonl
  max_length: 4096
  chat_template: qwen
  cache_dir: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/experiments/qwen3-vl-4b-dflash2-textvqa100-pr785-managed-local/cache
  build_dataset_num_proc: 4
  dataloader_num_workers: 1

training:
  strategy: dflash
  num_epochs: 1
  max_steps: 50
  batch_size: 1
  accumulation_steps: 2
  learning_rate: 0.0005
  lr_scheduler: constant
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  attention_backend: sdpa
  num_anchors: 32
  loss_decay_gamma: 7.0
  objective_chunk_blocks: 128
  loss_type: dflash
  dflash_teacher_metrics: false
  dflash2_selector_loss_alpha: 1.0
  dflash2_selector_stop_gradient: false
  save_interval: 50
  log_interval: 10
  dist_timeout: 30
  seed: 20261014
  prompt_seed: 20261014

tracking:
  report_to: none

runtime:
  producer_lease: 1
  producer_concurrency: 1

run_id: qwen3-vl-4b-dflash2-textvqa100-pr785-managed-local
output_dir: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/experiments/qwen3-vl-4b-dflash2-textvqa100-pr785-managed-local/output

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/experiments/qwen3-vl-4b-dflash2-textvqa100-pr785-managed-local/control
    consumer_state_dir: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/experiments/qwen3-vl-4b-dflash2-textvqa100-pr785-managed-local/consumer-state
    backend: mooncake
    managed_local:
      trainer_cuda_visible_devices: ["1"]
      shutdown_grace_s: 30
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 68719476736
        local_buffer_size_bytes: 1073741824
        default_kv_lease_ttl_ms: 10000
      capture_servers:
        - port: 30000
          cuda_visible_devices: ["2"]
          tp_size: 1
          mem_fraction_static: 0.55
          env:
            SGLANG_ENABLE_JIT_DEEPGEMM: "0"

