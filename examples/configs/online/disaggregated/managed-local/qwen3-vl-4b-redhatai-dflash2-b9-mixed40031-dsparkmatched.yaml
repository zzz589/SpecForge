    backend: mooncake
    client_buffer_size: 2147483648
    managed_local:
      trainer_cuda_visible_devices: ["6", "7"]
      shutdown_grace_s: 30
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 68719476736
        local_buffer_size_bytes: 2147483648
        default_kv_lease_ttl_ms: 10000
      capture_servers:
        - port: 30000
          cuda_visible_devices: ["5"]
          tp_size: 1
