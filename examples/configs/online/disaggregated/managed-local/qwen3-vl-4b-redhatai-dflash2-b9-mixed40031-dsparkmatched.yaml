  build_dataset_num_proc: 1
  dataloader_num_workers: 8

training:
  strategy: dflash
  num_epochs: 3
  batch_size: 1
  accumulation_steps: 2
  fsdp_sharding: SHARD_GRAD_OP
  learning_rate: 0.00001
  lr_scheduler: cosine
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  attention_backend: sdpa
  num_anchors: 32
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  loss_type: dflash
  dflash_teacher_metrics: false
  dflash2_selector_loss_alpha: 1.0
  dflash2_selector_stop_gradient: false
  save_interval: 2000
  log_interval: 10
  dist_timeout: 30
  seed: 20261014
  prompt_seed: 20261014

tracking:
  report_to: none

runtime:
  producer_lease: 1
  producer_concurrency: 1
  in_flight_high_watermark: 256
  in_flight_low_watermark: 192

run_id: qwen3-vl-4b-redhatai-dflash2-b9-mixed40031-dsparkmatched-gbs4-20261106
output_dir: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/experiments/qwen3-vl-4b-redhatai-dflash2-b9-mixed40031-dsparkmatched-gbs4-20261106/output

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 2
  disaggregated:
    control_dir: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/experiments/qwen3-vl-4b-redhatai-dflash2-b9-mixed40031-dsparkmatched-gbs4-20261106/control
