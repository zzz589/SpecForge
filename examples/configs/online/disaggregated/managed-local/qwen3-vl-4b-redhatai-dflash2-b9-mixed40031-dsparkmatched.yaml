# Qwen3-VL-4B + RedHatAI DFlash2 block-9, matched to the completed DSpark run.
# The stale 2026-10-14 mapped manifest is intentionally NOT reused: its cached
# vision grids differ from the current target/SGLang processor for 11,087 rows.
# Online preparation follows the same path as DSpark and keeps 40,031/41,561
# prompts; 1,530 over-length prompts are skipped before scheduling.
model:
  target_model_path: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/models/Qwen3-VL-4B-Instruct
  draft_model_config: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/experiments_results/qwen3-4b-redhatai-dflash2-specforge-b9-20261105/Qwen3-4B-speculator.dflash2-specforge-b9-v2
