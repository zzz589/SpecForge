# Full 41,561-sample Qwen3-VL + DFlash2 mRoPE recipe.
# Reuses the existing Arrow map and its cached image_grid_thw; Dataset.map is
# never called. Four GPUs: two capture servers plus two FSDP trainer ranks.
model:
  target_model_path: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/models/Qwen3-VL-4B-Instruct
  draft_model_config: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/experiments_results/qwen3-4b-redhatai-dflash2-specforge-b9-20261105/Qwen3-4B-speculator.dflash2-specforge-b9-qwen3vl-mrope-v1
  draft_checkpoint_path: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/experiments_results/qwen3-4b-redhatai-dflash2-specforge-b9-20261105/Qwen3-4B-speculator.dflash2-specforge-b9-qwen3vl-mrope-v1
  target_backend: sglang
  input_modality: multimodal
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  torch_dtype: bfloat16
  mask_token_id: 151669
  sglang_attention_backend: triton
  sglang_disable_radix_cache: true
  sglang_disable_cuda_graph: true
  sglang_context_length: 4111

data:
  train_data_path: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/data/mixed_llava_power/mixed_llava34000_power7561_seed20261014_pr785_dspark.jsonl
  mapped_manifest_path: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/data/mixed_llava_power/mixed_llava34000_power7561_seed20261014.manifest.json
  max_length: 4096
  chat_template: qwen
  cache_dir: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/experiments/qwen3-vl-4b-dflash2-mrope-mixed41561-4gpu-20261108/cache
  build_dataset_num_proc: 32
  dataloader_num_workers: 8

training:
  strategy: dflash
  num_epochs: 1
  batch_size: 1
  accumulation_steps: 2
  fsdp_sharding: SHARD_GRAD_OP
  learning_rate: 0.0006
  lr_scheduler: cosine
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: sdpa
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  loss_type: dflash
  # Public RedHatAI DFlash2 objective, expressed exactly by constant lambda.
  lk_loss_type: lambda
  kl_scale: 0.1
  kl_decay: 0.0
  dflash_teacher_metrics: false
  dflash2_selector_loss_alpha: 1.0
  dflash2_selector_stop_gradient: false
  save_interval: 2000
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 42

tracking:
  report_to: none

runtime:
  producer_lease: 1
  producer_concurrency: 2
  in_flight_high_watermark: 256
  in_flight_low_watermark: 192

run_id: qwen3-vl-4b-dflash2-mrope-mixed41561-4gpu-20261108
output_dir: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/experiments/qwen3-vl-4b-dflash2-mrope-mixed41561-4gpu-20261108/output

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 2
  disaggregated:
    control_dir: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/experiments/qwen3-vl-4b-dflash2-mrope-mixed41561-4gpu-20261108/control
    consumer_state_dir: /HOME/nsccgz_zgchen/nsccgz_zgchen_8/HDD_POOL/xj/experiments/qwen3-vl-4b-dflash2-mrope-mixed41561-4gpu-20261108/consumer-state
    backend: mooncake
    client_buffer_size: 2147483648
    managed_local:
      trainer_cuda_visible_devices: ["6", "7"]
      shutdown_grace_s: 30
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 68719476736
        local_buffer_size_bytes: 2147483648
        default_kv_lease_ttl_ms: 10000
      capture_servers:
        - port: 30000
          cuda_visible_devices: ["2"]
          tp_size: 1
          mem_fraction_static: 0.70
          env:
            SGLANG_ENABLE_JIT_DEEPGEMM: "0"
        - port: 30001
          cuda_visible_devices: ["5"]
          tp_size: 1
          mem_fraction_static: 0.70
          env:
            SGLANG_ENABLE_JIT_DEEPGEMM: "0"
